name: Publish

# Publishes the extension when a GitHub release is published, or by hand.
# Each marketplace is skipped unless its token is set as a repository secret:
#   VSCE_PAT  - Azure DevOps personal access token for the "eyalsec" publisher
#               (Organization: All accessible organizations, Scope: Marketplace > Manage)
#   OVSX_PAT  - Open VSX access token for the "eyalsec" namespace

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: The release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match package.json version $version"; exit 1; }
      - name: Package
        run: |
          npm run package
          echo "VSIX=$(ls *.vsix)" >> "$GITHUB_ENV"
      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath "$VSIX"
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.2.0 publish "$VSIX" --pat "$OVSX_PAT"
      - name: Say what was skipped
        if: env.VSCE_PAT == '' || env.OVSX_PAT == ''
        run: |
          [ -n "$VSCE_PAT" ] || echo "::warning::VSCE_PAT is not set, so the Visual Studio Marketplace was skipped."
          [ -n "$OVSX_PAT" ] || echo "::warning::OVSX_PAT is not set, so Open VSX was skipped."
